name: Flutter CI/CD

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Executa todos os dias às 2h da manhã (UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Executar workflow com debug habilitado'
        required: false
        default: false

env:
  FLUTTER_VERSION: '3.16.5'
  JAVA_VERSION: '17'

jobs:
  # Job para análise de código e linting
  analyze:
    name: 📊 Análise e Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Busca todo o histórico para análises mais completas
      
      - name: 🎯 Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 📦 Instalar dependências
        run: |
          flutter pub get
          flutter pub global activate dart_code_metrics
      
      - name: 🔍 Verificar formatação do código
        run: |
          dart format --set-exit-if-changed .
          if [ $? -ne 0 ]; then
            echo "❌ Código não está formatado corretamente!"
            echo "Execute 'dart format .' localmente para corrigir."
            exit 1
          fi
      
      - name: 🔎 Analisar código com Flutter Analyzer
        run: |
          flutter analyze --no-fatal-infos
          if [ $? -ne 0 ]; then
            echo "❌ Problemas encontrados na análise estática!"
            exit 1
          fi
      
      - name: 📊 Métricas de código
        run: |
          flutter pub global run dart_code_metrics:metrics analyze lib \
            --reporter=console \
            --set-exit-on-violation-level=warning
      
      - name: 🔒 Verificar dependências desatualizadas
        run: |
          flutter pub outdated --no-dev-dependencies
          echo "⚠️ Verifique as dependências desatualizadas acima"
      
      - name: 🛡️ Auditoria de segurança
        continue-on-error: true
        run: |
          flutter pub audit
  
  # Job para executar testes unitários e de widget
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 20
    
    strategy:
      matrix:
        include:
          - test-type: unit
            test-path: test/unit
          - test-type: widget
            test-path: test/widget
          - test-type: integration
            test-path: integration_test
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
      
      - name: 🎯 Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 📦 Instalar dependências
        run: flutter pub get
      
      - name: 🧪 Executar testes ${{ matrix.test-type }}
        run: |
          if [ -d "${{ matrix.test-path }}" ]; then
            flutter test ${{ matrix.test-path }} \
              --coverage \
              --test-randomize-ordering-seed random \
              --reporter expanded
          else
            echo "⚠️ Diretório de teste ${{ matrix.test-path }} não encontrado, pulando..."
          fi
      
      - name: 📊 Upload de cobertura para Codecov
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          flags: unittests
          name: flutter-coverage
          fail_ci_if_error: false
      
      - name: 📈 Gerar relatório de cobertura
        if: matrix.test-type == 'unit'
        run: |
          flutter pub global activate coverage
          flutter pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib
          
          # Calcular porcentagem de cobertura
          total_lines=$(lcov --summary coverage/lcov.info 2>/dev/null | grep "lines" | grep -oE "[0-9]+\.[0-9]+%" || echo "0%")
          echo "📊 Cobertura de código: $total_lines"
          
          # Criar badge de cobertura (opcional)
          echo "COVERAGE=$total_lines" >> $GITHUB_ENV
  
  # Job para build em múltiplas plataformas
  build:
    name: 🏗️ Build
    needs: [analyze, test]
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            build-cmd: 'flutter build apk --release --split-per-abi'
            artifact-path: 'build/app/outputs/flutter-apk/*.apk'
            artifact-name: 'android-apk'
          
          - platform: ios
            os: macos-latest
            build-cmd: 'flutter build ios --release --no-codesign'
            artifact-path: 'build/ios/iphoneos/*.app'
            artifact-name: 'ios-app'
          
          - platform: web
            os: ubuntu-latest
            build-cmd: 'flutter build web --release --web-renderer canvaskit --base-href /'
            artifact-path: 'build/web'
            artifact-name: 'web-app'
          
          - platform: windows
            os: windows-latest
            build-cmd: 'flutter build windows --release'
            artifact-path: 'build/windows/x64/runner/Release'
            artifact-name: 'windows-app'
          
          - platform: linux
            os: ubuntu-latest
            build-cmd: |
              sudo apt-get update -y
              sudo apt-get install -y ninja-build libgtk-3-dev
              flutter build linux --release
            artifact-path: 'build/linux/x64/release/bundle'
            artifact-name: 'linux-app'
          
          - platform: macos
            os: macos-latest
            build-cmd: 'flutter build macos --release'
            artifact-path: 'build/macos/Build/Products/Release/*.app'
            artifact-name: 'macos-app'
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java (para Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      
      - name: 🎯 Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 📦 Instalar dependências
        run: flutter pub get
      
      - name: 🔨 Build para ${{ matrix.platform }}
        run: ${{ matrix.build-cmd }}
      
      - name: 📤 Upload do artefato ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7
          if-no-files-found: warn
  
  # Job para verificar golden tests (testes de snapshot)
  golden-tests:
    name: 🎨 Golden Tests
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 15
    continue-on-error: true
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
      
      - name: 🎯 Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 📦 Instalar dependências
        run: flutter pub get
      
      - name: 🎨 Executar golden tests
        run: |
          if [ -d "test/golden" ]; then
            flutter test test/golden --update-goldens
            flutter test test/golden
          else
            echo "⚠️ Nenhum golden test encontrado"
          fi
  
  # Job para análise de performance
  performance:
    name: ⚡ Performance
    runs-on: ubuntu-latest
    needs: [analyze, test]
    timeout-minutes: 20
    continue-on-error: true
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
      
      - name: 🎯 Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 📦 Instalar dependências
        run: flutter pub get
      
      - name: 📊 Analisar tamanho do bundle
        run: |
          flutter build apk --release --analyze-size
          echo "📦 Análise de tamanho concluída"
      
      - name: ⚡ Verificar performance de build
        run: |
          START_TIME=$(date +%s)
          flutter build apk --release --no-sound-null-safety
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "⏱️ Tempo de build: ${BUILD_TIME} segundos"
          
          if [ $BUILD_TIME -gt 300 ]; then
            echo "⚠️ Build demorou mais de 5 minutos!"
          fi
  
  # Job de notificação final
  notify:
    name: 📢 Notificação
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    
    steps:
      - name: 📊 Resumo do workflow
        run: |
          echo "## 📊 Resumo do Workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ **Build concluído com sucesso!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build falhou!**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Detalhes:" >> $GITHUB_STEP_SUMMARY
          echo "- 🔀 Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 💬 Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 Autor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🕐 Horário: $(date)" >> $GITHUB_STEP_SUMMARY
      
      - name: 💬 Comentar no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `
            ## 🤖 Resultado do CI/CD Flutter
            
            ${context.payload.pull_request.head.sha.substring(0, 7)}
            
            | Status | Job |
            |--------|-----|
            | ${{ needs.analyze.result == 'success' && '✅' || '❌' }} | Análise e Lint |
            | ${{ needs.test.result == 'success' && '✅' || '❌' }} | Testes |
            | ${{ needs.build.result == 'success' && '✅' || '❌' }} | Build |
            
            [Ver detalhes completos](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });