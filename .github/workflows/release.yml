name: Release & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
      - 'beta-*'
      - 'rc-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para release (ex: 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'É uma pre-release?'
        required: false
        type: boolean
        default: false
      deploy_stores:
        description: 'Fazer deploy nas lojas?'
        required: false
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.16.5'
  JAVA_VERSION: '17'

jobs:
  # Preparação do release
  prepare-release:
    name: 📦 Preparar Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🏷️ Determinar versão
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versão: $VERSION"
      
      - name: 📝 Gerar changelog
        id: changelog
        run: |
          # Gera changelog baseado nos commits desde a última tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Formata changelog por categoria
          echo "## 📋 Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Features
          echo "### ✨ Features" >> CHANGELOG.md
          echo "$CHANGELOG" | grep -i "feat\|feature" | sed 's/feat.*://i' >> CHANGELOG.md || echo "Nenhuma" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Fixes
          echo "### 🐛 Fixes" >> CHANGELOG.md
          echo "$CHANGELOG" | grep -i "fix\|bugfix" | sed 's/fix.*://i' >> CHANGELOG.md || echo "Nenhum" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Improvements
          echo "### 🚀 Melhorias" >> CHANGELOG.md
          echo "$CHANGELOG" | grep -i "improve\|perf\|refactor" | sed 's/\(improve\|perf\|refactor\).*://i' >> CHANGELOG.md || echo "Nenhuma" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Docs
          echo "### 📚 Documentação" >> CHANGELOG.md
          echo "$CHANGELOG" | grep -i "doc" | sed 's/doc.*://i' >> CHANGELOG.md || echo "Nenhuma" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Others
          echo "### 🔧 Outros" >> CHANGELOG.md
          echo "$CHANGELOG" | grep -v -i "feat\|feature\|fix\|bugfix\|improve\|perf\|refactor\|doc" >> CHANGELOG.md || echo "Nenhum" >> CHANGELOG.md
          
          # Salva changelog para output
          CHANGELOG_CONTENT=$(cat CHANGELOG.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 📤 Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md
  
  # Build para Android
  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    needs: prepare-release
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 🔐 Decodificar keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
      
      - name: 🔑 Criar key.properties
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
      
      - name: 📦 Instalar dependências
        run: flutter pub get
      
      - name: 🏗️ Build APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=${{ needs.prepare-release.outputs.version }}
      
      - name: 🏗️ Build App Bundle
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} --build-name=${{ needs.prepare-release.outputs.version }}
      
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: 📤 Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: build/app/outputs/bundle/release/app-release.aab
  
  # Build para iOS
  build-ios:
    name: 🍎 Build iOS
    runs-on: macos-latest
    needs: prepare-release
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 🔐 Instalar certificados Apple
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Criar keychain temporário
          KEYCHAIN_NAME="build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # Importar certificado
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN_NAME" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # Instalar provisioning profile
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      
      - name: 📦 Instalar dependências
        run: |
          flutter pub get
          cd ios && pod install
      
      - name: 🏗️ Build iOS
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=${{ needs.prepare-release.outputs.version }}
      
      - name: 📦 Criar IPA
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r app.ipa Payload
      
      - name: 📤 Upload IPA
        if: env.IOS_CERTIFICATE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/app.ipa
  
  # Build para Web
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    needs: prepare-release
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 📦 Instalar dependências
        run: flutter pub get
      
      - name: 🏗️ Build Web
        run: |
          flutter build web --release \
            --web-renderer canvaskit \
            --base-href / \
            --pwa-strategy offline-first
      
      - name: 🗜️ Comprimir assets
        run: |
          cd build/web
          # Comprimir arquivos JS e CSS
          find . -name "*.js" -exec gzip -k {} \;
          find . -name "*.css" -exec gzip -k {} \;
      
      - name: 📤 Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
  
  # Build para Desktop (Windows, Linux, macOS)
  build-desktop:
    name: 💻 Build Desktop
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build-cmd: flutter build windows --release
            artifact-path: build/windows/x64/runner/Release
          
          - os: ubuntu-latest
            platform: linux
            build-cmd: |
              sudo apt-get update -y
              sudo apt-get install -y ninja-build libgtk-3-dev
              flutter build linux --release
            artifact-path: build/linux/x64/release/bundle
          
          - os: macos-latest
            platform: macos
            build-cmd: flutter build macos --release
            artifact-path: build/macos/Build/Products/Release
    
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: 📦 Instalar dependências
        run: flutter pub get
      
      - name: 🏗️ Build ${{ matrix.platform }}
        run: ${{ matrix.build-cmd }}
      
      - name: 📦 Criar instalador (Windows)
        if: matrix.platform == 'windows'
        run: |
          # Aqui você pode adicionar NSIS ou outro criador de instalador
          echo "Criando instalador Windows..."
      
      - name: 📦 Criar DMG (macOS)
        if: matrix.platform == 'macos'
        run: |
          # Criar DMG para distribuição
          echo "Criando DMG..."
      
      - name: 📦 Criar AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          # Criar AppImage para distribuição
          echo "Criando AppImage..."
      
      - name: 📤 Upload ${{ matrix.platform }} build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ matrix.artifact-path }}
  
  # Criar release no GitHub
  create-release:
    name: 🚀 Criar Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-android, build-ios, build-web, build-desktop]
    
    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: 🏷️ Criar Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: Release ${{ needs.prepare-release.outputs.version }}
          body: ${{ needs.prepare-release.outputs.changelog }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            artifacts/android-apk/*.apk
            artifacts/android-bundle/*.aab
            artifacts/ios-ipa/*.ipa
            artifacts/windows-build/**/*
            artifacts/linux-build/**/*
            artifacts/macos-build/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  # Deploy para lojas
  deploy-stores:
    name: 🏪 Deploy para Lojas
    runs-on: ubuntu-latest
    needs: [prepare-release, build-android, build-ios]
    if: github.event.inputs.deploy_stores == 'true' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 📥 Download Android Bundle
        uses: actions/download-artifact@v4
        with:
          name: android-bundle
          path: android
      
      - name: 📥 Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ios
      
      - name: 🤖 Deploy para Google Play
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.app
          releaseFiles: android/*.aab
          track: internal
          status: draft
          inAppUpdatePriority: 2
          whatsNewDirectory: whatsnew
      
      - name: 🍎 Deploy para App Store
        if: env.APP_STORE_CONNECT_API_KEY != ''
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          # Usar fastlane ou xcrun altool para upload
          echo "Fazendo upload para App Store Connect..."
  
  # Deploy Web
  deploy-web:
    name: 🌐 Deploy Web
    runs-on: ubuntu-latest
    needs: [prepare-release, build-web]
    if: github.event.inputs.deploy_stores == 'true' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 📥 Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web
      
      - name: 🚀 Deploy para Firebase Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: your-project-id
      
      - name: 🚀 Deploy para Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel
          vercel --prod --token=$VERCEL_TOKEN
      
      - name: 🚀 Deploy para Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './web'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  
  # Notificação
  notify:
    name: 📢 Notificação
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()
    
    steps:
      - name: 📊 Resumo do Release
        run: |
          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.create-release.result }}" == "success" ]; then
            echo "✅ **Release criado com sucesso!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Versão: ${{ needs.prepare-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🏗️ Builds:" >> $GITHUB_STEP_SUMMARY
            echo "- Android: ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- iOS: ${{ needs.build-ios.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Web: ${{ needs.build-web.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Desktop: ${{ needs.build-desktop.result }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Release falhou!**" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 💬 Notificar Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Release ${{ needs.prepare-release.outputs.version }} 
            Status: ${{ needs.create-release.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: '#releases'
          username: 'GitHub Actions'
          icon_emoji: ':rocket:'